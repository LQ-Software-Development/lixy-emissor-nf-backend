name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: emissor_nf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d emissor_nf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://user:password@localhost:5432/emissor_nf_test
      JWT_SECRET: ci-test-secret
      TYPEORM_SYNCHRONIZE: 'true'
      TYPEORM_MIGRATIONS_RUN: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --ci --coverage=false

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
