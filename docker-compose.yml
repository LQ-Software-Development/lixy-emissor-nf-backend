services:
  api:
    build: .
    ports:
      - '${API_PORT:-3009}:3009'
    environment:
      API_PORT: 3009
      DATABASE_URL: postgres://user:password@postgres:5432/emissor_nf_db
      TYPEORM_SYNCHRONIZE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emissor_nf_db
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d emissor_nf_db']
      interval: 5s
      timeout: 5s
      retries: 5
